name: Android preview checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, build and lint
        run: bash ./gradlew :core:test :app:assembleDebug :app:lintDebug --stacktrace
      - name: Verify APK privacy and model
        run: python3 scripts/check_apk.py "$ANDROID_HOME/build-tools/35.0.0/aapt" app/build/outputs/apk/debug/app-debug.apk
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-check-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: motion-0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
